<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授業動画視聴</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background: #000;
      min-height: 100vh;
      padding: 0;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      background: white;
      border-radius: 0;
      overflow: hidden;
      position: relative;
    }

    .content {
      padding: 0;
    }

    .section {
      margin-bottom: 8px;
      padding: 0;
      background: #fff;
      border-radius: 0;
      border-left: none;
    }

    .video-container {
      position: relative;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 0;
      background: #000;
      margin-bottom: 0;
    }

    .video-wrapper #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .video-block-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 100;
      pointer-events: auto;
      cursor: default;
      transition: opacity 0.3s;
    }

    .video-block-overlay.ad-playing {
      opacity: 0;
      pointer-events: none;
    }

    .external-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #f8f9fa;
      flex-wrap: wrap;
    }

    .control-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .close-bottom-btn {
      background: #dc3545;
    }

    .close-bottom-btn:hover {
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
    }

    .ad-notice {
      background: #fff3cd;
      padding: 10px;
      text-align: center;
      border-left: 4px solid #ffc107;
      display: none;
    }

    .ad-notice.show {
      display: block;
    }

    .ad-notice p {
      color: #856404;
      font-weight: bold;
      margin: 0;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <p id="videoTitle" style="text-align:center; padding:8px; font-size:14px; color:#555;"></p>

    <div class="content">
      <div class="section">
        <div class="video-container">
          <div class="video-wrapper">
            <div id="player"></div>
            <div id="videoBlockOverlay" class="video-block-overlay"></div>
          </div>

          <div class="external-controls">
            <button class="control-btn" id="playBtn" onclick="playVideo()">
              ▶ さいせい
            </button>
            <button class="control-btn" id="pauseBtn" onclick="pauseVideo()" style="display:none;">
              ⏸ いちじていし
            </button>
            <button class="control-btn" id="enableAdSkipBtn" onclick="enableAdSkip()" style="display:none;">
              ⏭ こうこくをとばす
            </button>
            <button class="control-btn close-bottom-btn" onclick="closeWindow()">
              ✖ とじる
            </button>
          </div>

          <div id="adNotice" class="ad-notice">
            <p>💡 こうこくが ひょうじされています。「こうこくをとばす」ボタンを おしてください。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let player = null;
    let playerReady = false;

    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v') || 'dQw4w9WgXcQ';
    const title = urlParams.get('title') || 'きょうのじゅぎょう';

    document.getElementById('videoTitle').textContent = title;

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
          'enablejsapi': 1,
          'rel': 0,
          'modestbranding': 1,
          'fs': 0,
          'controls': 1,
          'disablekb': 1,
          'iv_load_policy': 3,
          'showinfo': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      playerReady = true;
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        document.getElementById('playBtn').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'block';
      } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
        document.getElementById('playBtn').style.display = 'block';
        document.getElementById('pauseBtn').style.display = 'none';
      }
    }

    function onPlayerError(event) {
      console.error('YouTube Player エラー:', event.data);
      alert('動画の読み込みに失敗しました。動画IDが正しいか確認してください。');
    }

    function playVideo() {
      if (player && playerReady) {
        player.playVideo();
        setTimeout(() => {
          document.getElementById('enableAdSkipBtn').style.display = 'block';
        }, 3000);
      } else {
        alert('どうがの じゅんびちゅうです。もういちど おしてください。');
      }
    }

    function pauseVideo() {
      if (player && playerReady) {
        player.pauseVideo();
      }
    }

    function enableAdSkip() {
      const overlay = document.getElementById('videoBlockOverlay');
      const notice = document.getElementById('adNotice');
      const btn = document.getElementById('enableAdSkipBtn');

      overlay.classList.add('ad-playing');
      notice.classList.add('show');
      btn.disabled = true;
      btn.textContent = '⏳ 5びょう たいきちゅう...';

      setTimeout(() => {
        overlay.classList.remove('ad-playing');
        notice.classList.remove('show');
        btn.style.display = 'none';
        btn.disabled = false;
        btn.textContent = '⏭ こうこくをとばす';
      }, 5000);
    }

    function closeWindow() {
      window.close();
      setTimeout(() => {
        document.body.innerHTML = `
          <div style="
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f8f9fa;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
          ">
            <div>
              <p style="font-size: 48px; margin-bottom: 16px;">✅</p>
              <p style="color: #333; font-size: 18px; margin-bottom: 8px;">どうがをみおわりました</p>
              <p style="color: #666; font-size: 14px;">このページをとじて、もどってください</p>
            </div>
          </div>
        `;
      }, 100);
    }
  </script>
</body>
</html>
